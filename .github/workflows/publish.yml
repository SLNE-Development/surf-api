name: Publish

on:
  push:
    branches:
      - version/*
  workflow_dispatch:

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/version/')
    uses: SLNE-Development/surf-workflows/.github/workflows/build-publish-release-gradle.yml@master
    with:
      modules: "surf-api-paper-impl-*-all.jar;surf-api-velocity-impl-*-all.jar;surf-api-standalone-impl-*-all.jar"
      check-kotlin-abi: true
      pre-build-command: |
        git -c 'url.https://github.com/.insteadOf=git@github.com:' submodule update --init --recursive
        cd vendor
        GIT_AUTHOR_NAME=github-actions GIT_AUTHOR_EMAIL=actions@slne.dev \
          GIT_COMMITTER_NAME=github-actions GIT_COMMITTER_EMAIL=actions@slne.dev \
          ./gradlew applyPatches
    secrets: inherit
