syntax = "proto2";

package surf.types.v1;

option java_package = "dev.slne.surf.nats.types.proto";

// java.time.LocalDate in the ISO-8601 calendar. year, month and day are required: a reader rejects a message without
// them.
message LocalDate {
  // Proleptic year, year 0 is 1 BC.
  optional int32 year = 1;
  // Month of the year, 1 to 12.
  optional int32 month = 2;
  // Day of the month, 1 to 31.
  optional int32 day = 3;
}
