syntax = "proto2";

package surf.types.v1;

import "surf/nats/v1/options.proto";
import "surf/types/v1/ip_address.proto";

option java_package = "dev.slne.surf.nats.types.proto";

// java.net.InetSocketAddress. host and port are required: a reader rejects a message without them.
message InetSocketAddress {
  // Resolved address; unset for an unresolved socket address.
  optional IpAddress address = 1 [(surf.nats.v1.nullable) = true];
  // InetSocketAddress.getHostString(), a host name or an address literal.
  optional string host = 2;
  // 0 to 65535.
  optional int32 port = 3;
}
