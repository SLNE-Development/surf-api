syntax = "proto2";

package surf.types.v1;

import "surf/types/v1/local_date.proto";
import "surf/types/v1/local_time.proto";

option java_package = "dev.slne.surf.nats.types.proto";

// java.time.LocalDateTime, a date-time without offset or zone. date and time are required: a reader rejects a message
// without them.
message LocalDateTime {
  required LocalDate date = 1;
  required LocalTime time = 2;
}
