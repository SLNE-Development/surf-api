syntax = "proto2";

package surf.types.v1;

import "surf/types/v1/offset_date_time.proto";

option java_package = "dev.slne.surf.nats.types.proto";

// java.time.ZonedDateTime. date_time and zone_id are required: a reader rejects a message without them.
// The instant is preserved; the offset is recomputed from the reader's zone rules when it does not match them.
message ZonedDateTime {
  optional OffsetDateTime date_time = 1;
  // ZoneId.getId(), a region ID such as "Europe/Berlin" or an offset ID such as "+02:00".
  optional string zone_id = 2;
}
