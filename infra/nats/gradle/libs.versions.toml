[versions]
jnats = "2.26.4"
log4j = "2.25.3"
testcontainers-nats = "1.1.8"
surf-microservice = "2.+"
surf-api = "+"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
auto-service-annotations = "1.1.1"
junit = "6.1.3"
mockk = "1.14.11"
lincheck = "3.7"
nats-js = "3.4.0"
bufbuild-protobuf = "2.16.0"
kotlin-wrappers = "2026.9.3"
kotlin = "2.4.20"
wire = "7.1.0"
kotlinpoet = "2.4.0"
buildconfig = "6.1.2"

[libraries]
jnats = { group = "io.nats", name = "jnats", version.ref = "jnats" }
log4j-core = { group = "org.apache.logging.log4j", name = "log4j-core", version.ref = "log4j" }
log4j-api = { group = "org.apache.logging.log4j", name = "log4j-api", version.ref = "log4j" }
log4j-slf4j2-impl = { group = "org.apache.logging.log4j", name = "log4j-slf4j2-impl", version.ref = "log4j" }
testcontainers-nats = { group = "io.github.amadeusitgroup.testcontainers", name = "nats", version.ref = "testcontainers-nats" }
surf-microservice = { group = "dev.slne.surf.microservice", name = "surf-microservice-api-microservice", version.ref = "surf-microservice" }
surf-api-core = { group = "dev.slne.surf.api", name = "surf-api-core", version.ref = "surf-api" }
surf-api-standalone = { group = "dev.slne.surf.api", name = "surf-api-standalone", version.ref = "surf-api" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-protobuf = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-protobuf", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
auto-service-annotations = { group = "com.google.auto.service", name = "auto-service-annotations", version.ref = "auto-service-annotations" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
lincheck = { group = "org.jetbrains.lincheck", name = "lincheck", version.ref = "lincheck" }
kotlin-wrappers-bom = { group = "org.jetbrains.kotlin-wrappers", name = "kotlin-wrappers-bom", version.ref = "kotlin-wrappers" }
kotlin-wrappers-js = { group = "org.jetbrains.kotlin-wrappers", name = "kotlin-js" }
kotlin-wrappers-node = { group = "org.jetbrains.kotlin-wrappers", name = "kotlin-node" }
kotlin-wrappers-web = { group = "org.jetbrains.kotlin-wrappers", name = "kotlin-web" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
wire-schema = { group = "com.squareup.wire", name = "wire-schema", version.ref = "wire" }
kotlinpoet = { group = "com.squareup", name = "kotlinpoet", version.ref = "kotlinpoet" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-gradle-api = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin-api", version.ref = "kotlin" }
kotlin-serialization-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-serialization", version.ref = "kotlin" }
surf-api-gradle-plugin = { group = "dev.slne.surf.api", name = "surf-api-gradle-plugin", version.ref = "surf-api" }

[bundles]
log4j = ["log4j-core", "log4j-api", "log4j-slf4j2-impl"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-js-plain-objects = { id = "org.jetbrains.kotlin.plugin.js-plain-objects", version.ref = "kotlin" }
buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }
