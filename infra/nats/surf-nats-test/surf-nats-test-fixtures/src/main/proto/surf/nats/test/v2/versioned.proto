syntax = "proto2";

package surf.nats.test.v2;

option java_package = "dev.slne.surf.nats.test.proto.v2";

import "google/protobuf/empty.proto";
import "surf/nats/v1/options.proto";

// Major version 2 of surf/nats/test/v1/versioned.proto: same service and event names, versioned subjects and streams.
service VersionedService {
  rpc Ping(VersionedPingRequest) returns (VersionedPingReply);
}

// Persistent twin of VersionedService: one stream per major version.
service VersionedJournalService {
  option (surf.nats.v1.service) = { persistent: true };

  rpc Record(VersionedPingRequest) returns (google.protobuf.Empty);
  rpc Append(VersionedPingRequest) returns (VersionedPingReply);
}

message VersionedPingRequest {
  optional string message = 1;
  optional int32 attempt = 2 [default = 1];
}

message VersionedPingReply {
  optional string message = 1;
  optional int32 version = 2;
  optional string region = 3 [(surf.nats.v1.nullable) = true];
}

message VersionedChanged {
  option (surf.nats.v1.event) = true;

  optional string message = 1;
  optional int64 revision = 2;
}
