syntax = "proto2";

package surf.nats.testing.v1;

option java_package = "dev.slne.surf.nats.test.common.proto.v1";

import "google/protobuf/empty.proto";
import "surf/nats/v1/options.proto";

// Served by the test microservice (one instance per call).
service MicroserviceTestService {
  // Echoes the text with a prefix.
  rpc Echo(EchoRequest) returns (EchoResponse);
  // Always fails on the implementation.
  rpc Fail(FailRequest) returns (FailResponse);
  // Returns the size of the data; large data goes through the payload store.
  rpc Size(SizeRequest) returns (SizeResponse);
  // Returns the stored entries.
  rpc Stored(StoredRequest) returns (StoredResponse) {
    option (surf.nats.v1.method) = { call_timeout_seconds: 100 };
  }
  // Stores the entry (JetStream fire).
  rpc Store(StoreRequest) returns (google.protobuf.Empty) {
    option (surf.nats.v1.method) = { persistent: true };
  }
  // Returns the number of stored entries (JetStream RPC).
  rpc StoredCount(StoredCountRequest) returns (StoredCountResponse) {
    option (surf.nats.v1.method) = { persistent: true };
  }
}

message EchoRequest {
  required string text = 1;
}

message EchoResponse {
  required string text = 1;
}

message FailRequest {
  required string message = 1;
}

message FailResponse {
  required string text = 1;
}

message SizeRequest {
  required bytes data = 1;
}

message SizeResponse {
  required int32 size = 1;
}

message StoredRequest {
}

message StoredResponse {
  repeated string entries = 1;
}

message StoreRequest {
  required string entry = 1;
}

message StoredCountRequest {
}

message StoredCountResponse {
  required int32 count = 1;
}
