syntax = "proto2";

package surf.natsjs.test.v1;

import "google/protobuf/timestamp.proto";
import "surf/types/paper/v1/location.proto";
import "surf/types/v1/uuid.proto";

enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
  COLOR_GREEN = 2;
}

message Inner {
  required string label = 1;
  optional int32 count = 2;
}

message Rules {
  required string required_text = 1;
  optional string nullable_text = 2;
  optional int32 defaulted = 3 [default = 7];
  optional Inner inner = 4;
  repeated Inner inners = 5;
  map<string, Inner> inner_map = 6;
  oneof choice {
    string text_choice = 7;
    Inner inner_choice = 8;
    Color color_choice = 9;
  }
  optional google.protobuf.Timestamp at = 10;
  optional surf.types.v1.Uuid uuid = 11;
  optional surf.types.paper.v1.Location location = 12;
  optional Color color = 13;
  optional Color nullable_color = 14;
  repeated Color colors = 15;
  map<string, Color> color_map = 16;
  optional uint32 big = 17;
}
