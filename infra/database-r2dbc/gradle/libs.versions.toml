[versions]
exposed = "1.6.0"
r2dbc-mariadb = "1.4.2"
r2dbc-postgresql = "1.1.3.RELEASE"
r2dbc-pool = "1.0.2.RELEASE"
surf-microservice = "2.+"
flyway = "13.11.1"
mariadb-jdbc = "3.5.10"
postgresql-jdbc = "42.7.14"
testcontainers = "2.0.5"
junit = "6.1.3"
coroutines-test = "1.11.0"

[libraries]
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-r2dbc = { module = "org.jetbrains.exposed:exposed-r2dbc", version.ref = "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposed" }
exposed-migration-r2dbc = { module = "org.jetbrains.exposed:exposed-migration-r2dbc", version.ref = "exposed" }
r2dbc-mariadb = { module = "org.mariadb:r2dbc-mariadb", version.ref = "r2dbc-mariadb" }
r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql", version.ref = "r2dbc-postgresql" }
r2dbc-pool = { module = "io.r2dbc:r2dbc-pool", version.ref = "r2dbc-pool" }
surf-microservice = { module = "dev.slne.surf.microservice:surf-microservice-api-microservice", version.ref = "surf-microservice" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
mariadb-jdbc = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-jdbc" }
postgresql-jdbc = { module = "org.postgresql:postgresql", version.ref = "postgresql-jdbc" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-mariadb = { module = "org.testcontainers:testcontainers-mariadb", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines-test" }

[bundles]
exposed = ["exposed-core", "exposed-r2dbc", "exposed-java-time", "exposed-json", "exposed-migration-r2dbc"]
databaseDriver = ["r2dbc-mariadb", "r2dbc-postgresql"]
migration = ["flyway-core", "flyway-mysql", "flyway-postgresql", "mariadb-jdbc", "postgresql-jdbc"]
