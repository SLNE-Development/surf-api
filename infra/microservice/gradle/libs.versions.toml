[versions]
log4j = "2.25.3"
spark-standalone-agent = "1.10.172"
jnats = "2.26.4"
mariadb-jdbc = "3.5.10"
postgresql-jdbc = "42.7.14"
testcontainers = "2.0.5"
testcontainers-nats = "1.1.8"

[libraries]
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-slf4j2-impl = { module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j" }
spark-standalone-agent = { module = "me.lucko:spark-standalone-agent", version.ref = "spark-standalone-agent" }
jnats = { module = "io.nats:jnats", version.ref = "jnats" }
mariadb-jdbc = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-jdbc" }
postgresql-jdbc = { module = "org.postgresql:postgresql", version.ref = "postgresql-jdbc" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-mariadb = { module = "org.testcontainers:testcontainers-mariadb", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-nats = { module = "io.github.amadeusitgroup.testcontainers:nats", version.ref = "testcontainers-nats" }

[plugins]

[bundles]
log4j = ["log4j-core", "log4j-api", "log4j-slf4j2-impl"]